name: Build Valkey (from upstream)

# Builds ANY Valkey version that exists in bitnami/containers and pushes it to
# ghcr.io/<owner>/valkey:<version>.
#
# Pass a version (e.g. 8.1.4) or leave it empty to build the latest. The workflow
# resolves the version to the commit where Bitnami published it (Bitnami keeps only the
# latest minor on main and has no git tags, so older versions live in history), fetches
# just that version's sources, and builds them with the hand-maintained top-level
# Dockerfile.valkey. APP_VERSION, WAIT_FOR_PORT_VERSION and the package list are read
# from that version's own Dockerfile and passed as build-args, so the custom Dockerfile
# builds every version faithfully without hardcoding.

on:
  workflow_dispatch:
    inputs:
      valkey_version:
        description: "Valkey version to build, e.g. 8.1.4 (empty = latest in bitnami/containers)."
        required: false
        default: ""
      platforms:
        description: "Target platforms (comma-separated)"
        required: true
        default: "linux/amd64,linux/arm64"
      push_latest:
        description: "Also tag as :latest"
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: bitnami/containers
  PRODUCT: valkey

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (this fork)
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version, fetch sources, derive build args
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          image="${REGISTRY,,}/${owner,,}/${PRODUCT}"
          api="https://api.github.com/repos/${UPSTREAM_REPO}"
          want="${{ inputs.valkey_version }}"

          # 1) resolve target minor dir + the commit SHA that holds its sources
          if [ -z "$want" ] || [ "$want" = "latest" ]; then
            minor="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "${api}/contents/bitnami/${PRODUCT}" \
              | jq -r '.[] | select(.type=="dir") | .name' | sort -V | tail -1)"
            sha="main"
            echo "resolving latest -> minor ${minor} @ main"
          else
            minor="$(printf '%s' "$want" | cut -d. -f1,2)"
            sha=""
            for p in $(seq 1 10); do
              page="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                "${api}/commits?path=bitnami/${PRODUCT}/${minor}/debian-12/Dockerfile&per_page=100&page=${p}")"
              [ "$(printf '%s' "$page" | jq 'length')" -gt 0 ] || break
              sha="$(printf '%s' "$page" \
                | jq -r --arg v "$want" '.[] | select(.commit.message | contains("Release \($v)-debian")) | .sha' \
                | head -1)"
              if [ -n "$sha" ]; then break; fi
            done
            if [ -z "$sha" ]; then
              echo "::error::valkey ${want} not found in ${UPSTREAM_REPO} history (searched 10 pages of bitnami/${PRODUCT}/${minor})"
              exit 1
            fi
            echo "resolved ${want} -> minor ${minor} @ ${sha}"
          fi

          # 2) fetch just that commit's sources (shallow, blobless, sparse)
          dest="${RUNNER_TEMP}/bc"
          rm -rf "$dest"; mkdir -p "$dest"
          git -C "$dest" init -q
          git -C "$dest" remote add origin "https://github.com/${UPSTREAM_REPO}.git"
          git -C "$dest" config extensions.partialClone origin
          git -C "$dest" fetch -q --depth 1 --filter=blob:none origin "$sha"
          git -C "$dest" sparse-checkout init --cone
          git -C "$dest" sparse-checkout set "bitnami/${PRODUCT}/${minor}"
          git -C "$dest" checkout -q FETCH_HEAD
          ctx="${dest}/bitnami/${PRODUCT}/${minor}/debian-12"
          if [ ! -f "${ctx}/Dockerfile" ]; then
            echo "::error::no debian-12 sources for ${PRODUCT} ${minor} at ${sha}"
            exit 1
          fi

          # 3) derive build args from that version's own Dockerfile
          ver="$(grep -oE 'image\.version="[0-9][^"]*"' "${ctx}/Dockerfile" | head -1 | sed -E 's/.*="([^"]+)"/\1/')"
          wfp="$(grep -oE 'wait-for-port-[0-9][0-9.]*-[0-9]+' "${ctx}/Dockerfile" | head -1 | sed -E 's/^wait-for-port-//')"
          pkgs="$(grep -E '^RUN install_packages ' "${ctx}/Dockerfile" | head -1 | sed -E 's/^RUN install_packages //')"
          if [ -z "$ver" ] || [ -z "$wfp" ] || [ -z "$pkgs" ]; then
            echo "::error::could not derive version/wait-for-port/packages from ${ctx}/Dockerfile"
            exit 1
          fi

          # 4) build with our custom top-level Dockerfile, inside the fetched context
          cp "${GITHUB_WORKSPACE}/Dockerfile.${PRODUCT}" "${ctx}/Dockerfile.build"

          {
            echo "version=${ver}"
            echo "wait_for_port=${wfp}"
            echo "packages=${pkgs}"
            echo "context=${ctx}"
            echo "dockerfile=${ctx}/Dockerfile.build"
            echo "tags<<EOF"
            echo "${image}:${ver}"
            if [ "${{ inputs.push_latest }}" = "true" ]; then echo "${image}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            WAIT_FOR_PORT_VERSION=${{ steps.meta.outputs.wait_for_port }}
            PACKAGES=${{ steps.meta.outputs.packages }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=valkey-${{ steps.meta.outputs.version }}
          cache-to: type=gha,mode=max,scope=valkey-${{ steps.meta.outputs.version }}

      - name: Summary
        run: |
          {
            echo "### Built Valkey image"
            echo ""
            echo "**Version:** ${{ steps.meta.outputs.version }}"
            echo "**wait-for-port:** ${{ steps.meta.outputs.wait_for_port }}"
            echo "**Packages:** ${{ steps.meta.outputs.packages }}"
            echo "**Platforms:** ${{ inputs.platforms }}"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
