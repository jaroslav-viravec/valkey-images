name: Build Sentinel

# Builds the Valkey Sentinel image from the VENDORED sources already in this repo
# (valkey-sentinel/ directory, populated by sync-sentinel.yaml and merged via PR).
#
# Unlike build-sentinel.yaml, this workflow does NOT fetch from upstream — it uses
# exactly what was reviewed and merged, so build = what was audited.
#
# Intended flow:
#   1. sync-sentinel.yaml detects new upstream version → opens PR with updated sources
#   2. You review and merge the PR into the default branch
#   3. Trigger THIS workflow — it reads from valkey-sentinel/ and builds

on:
  workflow_dispatch:
    inputs:
      sentinel_version:
        description: "Valkey Sentinel version to build. Run 'Refresh version choices' after merging a sync PR to update this list."
        required: true
        type: choice
        options:  # auto-updated by refresh-version-choices.yaml
          - "latest"
          - "8.1.4"
      platforms:
        description: "Target platforms (comma-separated)"
        required: true
        default: "linux/amd64,linux/arm64"
      push_latest:
        description: "Also tag as :latest"
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  PRODUCT: valkey-sentinel

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and derive build args from vendored sources
        id: meta
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          image="${REGISTRY,,}/${owner,,}/${PRODUCT}"
          want="${{ inputs.sentinel_version }}"
          # "latest" choice means: resolve to newest vendored version
          [ "$want" = "latest" ] && want=""

          # 1) find the right major.minor dir in vendored sources
          # (valkey-sentinel uses major.minor dirs, e.g. valkey-sentinel/8.1/debian-12)
          if [ -z "$want" ] || [ "$want" = "latest" ]; then
            dir="$(ls -d "${GITHUB_WORKSPACE}/valkey-sentinel"/[0-9]*/ 2>/dev/null \
              | xargs -n1 basename | sort -V | tail -1)"
            echo "using latest vendored dir: ${dir}"
          else
            dir="$(printf '%s' "$want" | cut -d. -f1,2)"
            echo "using dir ${dir} for requested version ${want}"
          fi

          ctx="${GITHUB_WORKSPACE}/valkey-sentinel/${dir}/debian-12"
          if [ ! -f "${ctx}/Dockerfile" ]; then
            echo "::error::no vendored sources at valkey-sentinel/${dir}/debian-12/Dockerfile"
            echo "::error::Merge a sync-sentinel PR first, then re-run this workflow."
            exit 1
          fi

          # 2) derive build args from the vendored Dockerfile (no upstream API calls)
          ver="$(grep -oE 'image\.version="[0-9][^"]*"' "${ctx}/Dockerfile" | head -1 | sed -E 's/.*="([^"]+)"/\1/')"
          pkgs="$(grep -E '^RUN install_packages ' "${ctx}/Dockerfile" | head -1 | sed -E 's/^RUN install_packages //')"
          if [ -z "$ver" ] || [ -z "$pkgs" ]; then
            echo "::error::could not derive version/packages from ${ctx}/Dockerfile"
            exit 1
          fi

          # warn if the requested version differs from what's vendored (build proceeds with vendored)
          if [ -n "$want" ] && [ "$want" != "latest" ] && [ "$ver" != "$want" ]; then
            echo "::warning::requested ${want} but vendored sources contain ${ver} — building ${ver}"
          fi
          echo "building ${PRODUCT} ${ver} from vendored sources"

          # 3) stage our custom top-level Dockerfile inside the vendored context
          cp "${GITHUB_WORKSPACE}/Dockerfile.${PRODUCT}" "${ctx}/Dockerfile.build"

          {
            echo "version=${ver}"
            echo "packages=${pkgs}"
            echo "context=${ctx}"
            echo "dockerfile=${ctx}/Dockerfile.build"
            echo "tags<<EOF"
            echo "${image}:${ver}"
            if [ "${{ inputs.push_latest }}" = "true" ]; then echo "${image}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            PACKAGES=${{ steps.meta.outputs.packages }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=sentinel-${{ steps.meta.outputs.version }}
          cache-to: type=gha,mode=max,scope=sentinel-${{ steps.meta.outputs.version }}

      - name: Summary
        run: |
          {
            echo "### Built Valkey Sentinel image (vendored sources)"
            echo ""
            echo "**Version:** ${{ steps.meta.outputs.version }}"
            echo "**Packages:** ${{ steps.meta.outputs.packages }}"
            echo "**Platforms:** ${{ inputs.platforms }}"
            echo "**Source:** vendored \`valkey-sentinel/\` in this repo (merged sync PR)"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
