name: Build Exporter (from upstream)

# Builds ANY Redis Exporter version that exists in bitnami/containers and pushes it to
# ghcr.io/<owner>/redis-exporter:<version>.
#
# Pass a version (e.g. 1.92.1) or leave it empty to build the latest. The workflow
# resolves the version to the commit where Bitnami published it, fetches just that
# version's sources, and builds them with the hand-maintained top-level
# Dockerfile.redis-exporter. APP_VERSION and the package list are read from that
# version's own Dockerfile and passed as build-args, so the custom Dockerfile builds
# every version faithfully without hardcoding.
#
# Note: redis-exporter uses major-only source dirs (redis-exporter/<major>/debian-12),
# unlike valkey/sentinel which use <major.minor>.

on:
  workflow_dispatch:
    inputs:
      exporter_version:
        description: "Redis Exporter version to build, e.g. 1.92.1 (empty = latest in bitnami/containers)."
        required: false
        default: ""
      platforms:
        description: "Target platforms (comma-separated)"
        required: true
        default: "linux/amd64,linux/arm64"
      push_latest:
        description: "Also tag as :latest"
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: bitnami/containers
  PRODUCT: redis-exporter

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (this fork)
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show available upstream versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${UPSTREAM_REPO}"
          sum="$GITHUB_STEP_SUMMARY"
          echo "### Available upstream versions for \`${PRODUCT}\`" >> "$sum"
          echo "_Tip: run the **List available versions** workflow for a full view including vendored sources._" >> "$sum"
          echo "" >> "$sum"
          dirs="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "${api}/contents/bitnami/${PRODUCT}" \
            | jq -r '.[] | select(.type=="dir") | .name' | sort -V)"
          for dir in $dirs; do
            ver="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "${api}/contents/bitnami/${PRODUCT}/${dir}/debian-12/Dockerfile" \
              | jq -r '.content // empty' | base64 -d \
              | grep -oE 'image\.version="[0-9][^"]*"' | head -1 \
              | sed -E 's/.*="([^"]+)"/\1/' 2>/dev/null || echo 'unknown')"
            echo "- \`${ver}\` (dir \`${dir}\`)" >> "$sum"
          done
          echo "" >> "$sum"

      - name: Resolve version, fetch sources, derive build args
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          image="${REGISTRY,,}/${owner,,}/${PRODUCT}"
          api="https://api.github.com/repos/${UPSTREAM_REPO}"
          want="${{ inputs.exporter_version }}"

          # 1) resolve target dir (major only) + the commit SHA that holds its sources
          if [ -z "$want" ] || [ "$want" = "latest" ]; then
            dir="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "${api}/contents/bitnami/${PRODUCT}" \
              | jq -r '.[] | select(.type=="dir") | .name' | sort -V | tail -1)"
            sha="main"
            echo "resolving latest -> dir ${dir} @ main"
          else
            dir="$(printf '%s' "$want" | cut -d. -f1)"
            # verify dir exists upstream before spending time searching commit history
            avail_dirs="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "${api}/contents/bitnami/${PRODUCT}" \
              | jq -r '.[] | select(.type=="dir") | .name' | sort -V)"
            if ! echo "$avail_dirs" | grep -qx "$dir"; then
              echo "::error::dir '${dir}' not found upstream for ${PRODUCT}."
              echo "::error::Available dirs: $(echo "$avail_dirs" | tr '\n' ' ')"
              echo "::error::Run the 'List available versions' workflow for exact version numbers."
              exit 1
            fi
            sha=""
            for p in $(seq 1 10); do
              page="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                "${api}/commits?path=bitnami/${PRODUCT}/${dir}/debian-12/Dockerfile&per_page=100&page=${p}")"
              [ "$(printf '%s' "$page" | jq 'length')" -gt 0 ] || break
              sha="$(printf '%s' "$page" \
                | jq -r --arg v "$want" '.[] | select(.commit.message | contains("Release \($v)-debian")) | .sha' \
                | head -1)"
              if [ -n "$sha" ]; then break; fi
            done
            if [ -z "$sha" ]; then
              echo "::error::${PRODUCT} ${want} not found in ${UPSTREAM_REPO} history (searched 10 pages of bitnami/${PRODUCT}/${dir})"
              exit 1
            fi
            echo "resolved ${want} -> dir ${dir} @ ${sha}"
          fi

          # 2) fetch just that commit's sources (shallow, blobless, sparse)
          dest="${RUNNER_TEMP}/bc"
          rm -rf "$dest"; mkdir -p "$dest"
          git -C "$dest" init -q
          git -C "$dest" remote add origin "https://github.com/${UPSTREAM_REPO}.git"
          git -C "$dest" config extensions.partialClone origin
          git -C "$dest" fetch -q --depth 1 --filter=blob:none origin "$sha"
          git -C "$dest" sparse-checkout init --cone
          git -C "$dest" sparse-checkout set "bitnami/${PRODUCT}/${dir}"
          git -C "$dest" checkout -q FETCH_HEAD
          ctx="${dest}/bitnami/${PRODUCT}/${dir}/debian-12"
          if [ ! -f "${ctx}/Dockerfile" ]; then
            echo "::error::no debian-12 sources for ${PRODUCT} ${dir} at ${sha}"
            exit 1
          fi

          # 3) derive build args from that version's own Dockerfile
          ver="$(grep -oE 'image\.version="[0-9][^"]*"' "${ctx}/Dockerfile" | head -1 | sed -E 's/.*="([^"]+)"/\1/')"
          pkgs="$(grep -E '^RUN install_packages ' "${ctx}/Dockerfile" | head -1 | sed -E 's/^RUN install_packages //')"
          if [ -z "$ver" ] || [ -z "$pkgs" ]; then
            echo "::error::could not derive version/packages from ${ctx}/Dockerfile"
            exit 1
          fi

          # 4) build with our custom top-level Dockerfile, inside the fetched context
          cp "${GITHUB_WORKSPACE}/Dockerfile.${PRODUCT}" "${ctx}/Dockerfile.build"

          {
            echo "version=${ver}"
            echo "packages=${pkgs}"
            echo "context=${ctx}"
            echo "dockerfile=${ctx}/Dockerfile.build"
            echo "tags<<EOF"
            echo "${image}:${ver}"
            if [ "${{ inputs.push_latest }}" = "true" ]; then echo "${image}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            PACKAGES=${{ steps.meta.outputs.packages }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=exporter-${{ steps.meta.outputs.version }}
          cache-to: type=gha,mode=max,scope=exporter-${{ steps.meta.outputs.version }}

      - name: Summary
        run: |
          {
            echo "### Built redis-exporter image"
            echo ""
            echo "**Version:** ${{ steps.meta.outputs.version }}"
            echo "**Packages:** ${{ steps.meta.outputs.packages }}"
            echo "**Platforms:** ${{ inputs.platforms }}"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
