name: Build Exporter

# Builds the Redis Exporter image from the VENDORED sources already in this repo
# (redis-exporter/ directory, populated by sync-exporter.yaml and merged via PR).
#
# Unlike build-exporter.yaml, this workflow does NOT fetch from upstream — it uses
# exactly what was reviewed and merged, so build = what was audited.
#
# Intended flow:
#   1. sync-exporter.yaml detects new upstream version → opens PR with updated sources
#   2. You review and merge the PR into the default branch
#   3. Trigger THIS workflow — it reads from redis-exporter/ and builds

on:
  workflow_dispatch:
    inputs:
      exporter_version:
        description: "Redis Exporter version to build. Run 'Refresh version choices' after merging a sync PR to update this list."
        required: true
        type: choice
        options:  # auto-updated by refresh-version-choices.yaml
          - "latest"
          - "1.94.0"
      platforms:
        description: "Target platforms (comma-separated)"
        required: true
        default: "linux/amd64,linux/arm64"
      push_latest:
        description: "Also tag as :latest"
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  PRODUCT: redis-exporter

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show available vendored versions
        run: |
          set -euo pipefail
          sum="$GITHUB_STEP_SUMMARY"
          echo "### Available vendored versions for \`${PRODUCT}\`" >> "$sum"
          echo "_Tip: run **Refresh version choices** after merging a sync PR to add new versions to this dropdown._" >> "$sum"
          echo "" >> "$sum"
          found=0
          for dir in $(ls -d "${GITHUB_WORKSPACE}/${PRODUCT}"/[0-9]*/ 2>/dev/null | sort -V); do
            dname="$(basename "$dir")"
            dfile="${dir}debian-12/Dockerfile"
            [ -f "$dfile" ] || continue
            ver="$(grep -oE 'image\.version="[0-9][^"]*"' "$dfile" | head -1 | sed -E 's/.*="([^"]+)"/\1/')"
            [ -n "$ver" ] || continue
            echo "- \`${ver}\` (dir \`${dname}\`)" >> "$sum"
            found=1
          done
          [ "$found" -eq 1 ] || echo "> No vendored sources found — merge a \`sync-${PRODUCT}\` PR first." >> "$sum"
          echo "" >> "$sum"

      - name: Resolve version and derive build args from vendored sources
        id: meta
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          image="${REGISTRY,,}/${owner,,}/${PRODUCT}"
          want="${{ inputs.exporter_version }}"
          # "latest" choice means: resolve to newest vendored version
          [ "$want" = "latest" ] && want=""

          # 1) locate the right major dir inside the vendored redis-exporter/ tree
          # (Bitnami uses major-only dirs for redis-exporter, e.g. redis-exporter/1/debian-12)
          if [ -z "$want" ] || [ "$want" = "latest" ]; then
            dir="$(ls -d "${GITHUB_WORKSPACE}/redis-exporter"/[0-9]*/ 2>/dev/null \
              | xargs -n1 basename | sort -V | tail -1)"
            echo "using latest vendored dir: ${dir}"
          else
            dir="$(printf '%s' "$want" | cut -d. -f1)"
            echo "using dir ${dir} for requested version ${want}"
          fi

          ctx="${GITHUB_WORKSPACE}/redis-exporter/${dir}/debian-12"
          if [ ! -f "${ctx}/Dockerfile" ]; then
            avail="$(ls -d "${GITHUB_WORKSPACE}/${PRODUCT}"/[0-9]*/ 2>/dev/null | xargs -n1 basename | sort -V | tr '\n' ' ' || true)"
            echo "::error::no vendored sources at ${PRODUCT}/${dir}/debian-12/Dockerfile"
            echo "::error::Available vendored dirs: ${avail:-none} — merge a sync-${PRODUCT} PR first."
            exit 1
          fi

          # 2) derive build args from the vendored Dockerfile (no upstream API calls)
          ver="$(grep -oE 'image\.version="[0-9][^"]*"' "${ctx}/Dockerfile" | head -1 | sed -E 's/.*="([^"]+)"/\1/')"
          pkgs="$(grep -E '^RUN install_packages ' "${ctx}/Dockerfile" | head -1 | sed -E 's/^RUN install_packages //')"
          if [ -z "$ver" ] || [ -z "$pkgs" ]; then
            echo "::error::could not derive version/packages from ${ctx}/Dockerfile"
            exit 1
          fi

          # warn if the requested version differs from what's vendored (build proceeds with vendored)
          if [ -n "$want" ] && [ "$want" != "latest" ] && [ "$ver" != "$want" ]; then
            echo "::warning::requested ${want} but vendored sources contain ${ver} — building ${ver}"
          fi
          echo "building ${PRODUCT} ${ver} from vendored sources"

          # 3) stage our custom top-level Dockerfile inside the vendored context
          cp "${GITHUB_WORKSPACE}/Dockerfile.${PRODUCT}" "${ctx}/Dockerfile.build"

          {
            echo "version=${ver}"
            echo "packages=${pkgs}"
            echo "context=${ctx}"
            echo "dockerfile=${ctx}/Dockerfile.build"
            echo "tags<<EOF"
            echo "${image}:${ver}"
            if [ "${{ inputs.push_latest }}" = "true" ]; then echo "${image}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            PACKAGES=${{ steps.meta.outputs.packages }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=exporter-${{ steps.meta.outputs.version }}
          cache-to: type=gha,mode=max,scope=exporter-${{ steps.meta.outputs.version }}

      - name: Summary
        run: |
          {
            echo "### Built redis-exporter image (vendored sources)"
            echo ""
            echo "**Version:** ${{ steps.meta.outputs.version }}"
            echo "**Packages:** ${{ steps.meta.outputs.packages }}"
            echo "**Platforms:** ${{ inputs.platforms }}"
            echo "**Source:** vendored \`redis-exporter/\` in this repo (merged sync PR)"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
