name: Refresh version choices

# Scans vendored sources in this repo and updates the type: choice dropdown
# options in the v2 build workflows so users see real version numbers instead
# of typing them manually.
#
# Triggers automatically whenever a sync PR is merged (vendored sources change),
# or manually at any time. The workflow commits the updated build YAML files
# back to the default branch.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "redis-exporter/**"
      - "valkey/**"
      - "valkey-sentinel/**"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover redis-exporter vendored versions
        id: exporter
        run: |
          set -euo pipefail
          versions=""
          for dir in $(ls -d "${GITHUB_WORKSPACE}/redis-exporter"/[0-9]*/ 2>/dev/null | sort -rV); do
            dfile="${dir}debian-12/Dockerfile"
            [ -f "$dfile" ] || continue
            ver="$(grep -oE 'image\.version="[0-9][^"]*"' "$dfile" | head -1 | sed -E 's/.*="([^"]+)"/\1/')"
            [ -n "$ver" ] && versions="${versions} ${ver}"
          done
          echo "versions=${versions# }" >> "$GITHUB_OUTPUT"
          echo "Found redis-exporter versions: ${versions# :-none}"

      - name: Update build-exporter-v2.yaml choices
        run: |
          set -euo pipefail
          vers="${{ steps.exporter.outputs.versions }}"
          if [ -z "$vers" ]; then
            echo "No vendored redis-exporter versions found — skipping choices update."
            exit 0
          fi
          # shellcheck disable=SC2086
          python3 .github/scripts/update-version-choices.py \
            .github/workflows/build-exporter-v2.yaml \
            $vers

      - name: Commit and push updated choices
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-exporter-v2.yaml
          if git diff --cached --quiet; then
            echo "Version choices already up to date — nothing to commit."
            exit 0
          fi
          git commit -m "chore(versions): refresh build-exporter-v2 version choices"
          git push origin HEAD
