name: Refresh version choices

# Scans vendored sources in this repo and updates the type: choice dropdown
# options in all v2 build workflows so users see real version numbers instead
# of typing them manually.
#
# Triggers automatically whenever a sync PR is merged (vendored sources change
# on main), or run manually at any time.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "redis-exporter/**"
      - "valkey/**"
      - "valkey-sentinel/**"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Discover vendored versions
        id: versions
        run: |
          set -euo pipefail

          discover() {
            local product="$1" versions=""
            for dir in $(ls -d "${GITHUB_WORKSPACE}/${product}"/[0-9]*/ 2>/dev/null | sort -rV); do
              local dfile="${dir}debian-12/Dockerfile"
              [ -f "$dfile" ] || continue
              local ver
              ver="$(grep -oE 'image\.version="[0-9][^"]*"' "$dfile" | head -1 | sed -E 's/.*="([^"]+)"/\1/')"
              [ -n "$ver" ] && versions="${versions} ${ver}"
            done
            echo "${versions# }"
          }

          exporter="$(discover redis-exporter)"
          valkey="$(discover valkey)"
          sentinel="$(discover valkey-sentinel)"

          echo "exporter=${exporter}" >> "$GITHUB_OUTPUT"
          echo "valkey=${valkey}"     >> "$GITHUB_OUTPUT"
          echo "sentinel=${sentinel}" >> "$GITHUB_OUTPUT"

          echo "redis-exporter:  ${exporter:-none}"
          echo "valkey:          ${valkey:-none}"
          echo "valkey-sentinel: ${sentinel:-none}"

      - name: Update version choices in build workflows
        run: |
          set -euo pipefail
          script=".github/scripts/update-version-choices.py"

          [ -n "${{ steps.versions.outputs.exporter }}" ] && \
            python3 "$script" .github/workflows/build-exporter.yaml \
              ${{ steps.versions.outputs.exporter }} || true

          [ -n "${{ steps.versions.outputs.valkey }}" ] && \
            python3 "$script" .github/workflows/build-valkey.yaml \
              ${{ steps.versions.outputs.valkey }} || true

          [ -n "${{ steps.versions.outputs.sentinel }}" ] && \
            python3 "$script" .github/workflows/build-sentinel.yaml \
              ${{ steps.versions.outputs.sentinel }} || true

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-exporter.yaml \
                  .github/workflows/build-valkey.yaml \
                  .github/workflows/build-sentinel.yaml
          if git diff --cached --quiet; then
            echo "Version choices already up to date — nothing to commit."
            exit 0
          fi
          git commit -m "chore(versions): refresh version choices in build workflows"
          git push origin HEAD
